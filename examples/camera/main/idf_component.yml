dependencies:
  idf:
    version: ">=5.5"
  espressif/esp_websocket_client:
    version: "^1.2.0"
  espressif/cjson:
    version: "*"
  # ESP32-P4 has no radio: Wi-Fi comes from the board's ESP32-C6 co-processor over SDIO,
  # and esp_wifi calls are forwarded to it
  espressif/esp_hosted:
    version: "^3.0.9"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target == esp32p4"
      - if: "idf_version <6.1"
#  sinricpro/esp-idf: ^1.4.0
